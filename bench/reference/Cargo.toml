[package]
name = "nexy-bench-reference"
version = "0.1.0"
edition = "2021"
publish = false
description = "The ceiling of the machine: plaintext and JSON from hyper alone, no Python"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
