name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "docs/**", "chore/**"]
  pull_request:
    branches: [develop, main]

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust stable
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Run every gate
        run: python3 scripts/verify.py

  attribution:
    name: Commit attribution
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject AI attribution in new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            RANGE="${BASE}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          python3 scripts/check_attribution.py --range "$RANGE"

  characters:
    name: Character check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject characters a person does not type
        run: python3 scripts/check_human_characters.py

  release:
    name: Release setup
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the release workflow
        run: python3 scripts/check_release_setup.py --publish-command 'cargo publish --locked'

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@d3987c21c5eaa7032030b1443adb92ad26c75295 # cargo-audit
        with:
          tool: cargo-audit

      - name: Reject known vulnerabilities
        run: cargo audit

  package:
    name: Build crate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Package the crate
        run: cargo package --locked

      - name: Check the artifact
        run: test -f target/package/nexy-server-0.1.0.crate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: target/package/*.crate
          retention-days: 7
          if-no-files-found: error

  review:
    name: Maintainer review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Require the maintainer approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
          MAINTAINER: Espoir-Loem
        run: |
          if [ "$AUTHOR" = "$MAINTAINER" ]; then
            echo "Maintainer pull request: no separate validation needed"
            exit 0
          fi
          COUNT=$(gh api "repos/$GH_REPO/pulls/$NUMBER/reviews" --paginate \
            --jq "[.[] | select(.state == \"APPROVED\" and .user.login == \"$MAINTAINER\")] | length")
          test "$COUNT" -ge 1
